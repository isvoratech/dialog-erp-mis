spring:
  application.name: dialog-erp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dialog_erp}
    username: ${DB_USER:dialog}
    password: ${DB_PASSWORD:dialog}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 64MB
    max-request-size: 64MB
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: native
management.endpoints.web.exposure.include: health,info
recovery:
  calculator-url: ${CALCULATOR_URL:http://localhost:8000}
  formula-version: 1.0
